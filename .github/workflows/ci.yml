name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint · secrets · tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q -x 'web/vendor|web/senpai' .

      - name: Ruff lint
        run: ruff check .

      - name: Secret scan (no real credentials)
        run: |
          python - <<'PY'
          import pathlib, re, sys
          pats = [
              re.compile(r"gh[pousr]_[A-Za-z0-9]{30,}"),
              re.compile(r"sk-[A-Za-z0-9]{30,}"),
              re.compile(r"SG\.[A-Za-z0-9_-]{20,}"),
              re.compile(r"\b\d{8,10}:[A-Za-z0-9_-]{35}\b"),
          ]
          bad = []
          skip = {"web/vendor", "docs/marketing", ".venv"}
          for f in pathlib.Path(".").rglob("*"):
              if not f.is_file() or f.suffix not in {".py", ".md", ".html", ".js", ".yml", ".yaml", ".json", ".env"} and f.name not in {".env.example"}:
                  continue
              if any(s in str(f) for s in skip):
                  continue
              try:
                  txt = f.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for p in pats:
                  if p.search(txt):
                      bad.append(str(f))
          if bad:
              print("possible secrets in:", *bad, sep="\n  ")
              sys.exit(1)
          print("secret scan clean")
          PY

      - name: Pytest
        run: pytest
