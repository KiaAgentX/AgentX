name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck · test · build · secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck (src + tests, strict)
        run: npm run typecheck

      - name: Unit tests (node:test)
        run: npm test

      - name: Build
        run: npm run build

      - name: Secret scan (no real credentials in the repo)
        run: |
          PATTERNS='(sk-[A-Za-z0-9_-]{30,})|(gh[pousr]_[A-Za-z0-9]{30,})|([0-9]{8,10}:[A-Za-z0-9_-]{35})|(AKIA[0-9A-Z]{16})|(-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----)'
          # tests/ is excluded on purpose: the redaction-layer fixtures
          # (tests/security.test.ts) MUST contain fake secret-shaped strings.
          HITS=$(grep -rEl "$PATTERNS" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=db --exclude-dir=tests . || true)
          if [ -n "$HITS" ]; then
            echo "::error::Potential secrets committed:"
            echo "$HITS"
            exit 1
          fi

      - name: Smoke — boot web-only mode
        run: |
          # SQLite path is env-driven (prisma/schema.prisma) — set it for CI.
          export DATABASE_URL=file:../db/custom.db
          export CI_ENV="NODE_ENV=production PORT=3999 MCP_TOKEN_SECRET=ci-secret-0123456789abcdef DASHBOARD_KEY=ci-dashboard-key OWNER_IDS=1"
          env $CI_ENV npx prisma db push --skip-generate
          env $CI_ENV node dist/index.js &
          sleep 6
          curl -fsS http://127.0.0.1:3999/healthz
          # owner endpoints now require the key (fail-closed)
          curl -fsS -H "X-KIA-Key: ci-dashboard-key" http://127.0.0.1:3999/api/v1/overview > /dev/null
          # keyless access to owner data must be REJECTED
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/api/v1/overview)" = "401"
          curl -fsS http://127.0.0.1:3999/api/v1/brand > /dev/null
          # public product list must NOT leak delivery payloads
          ! curl -fsS http://127.0.0.1:3999/api/v1/products | grep -q deliveryPayload

      - name: Smoke — backup tool (VACUUM INTO)
        run: |
          export DATABASE_URL=file:../db/custom.db
          npx tsx scripts/backup.ts --out /tmp/xdrop-backups
          test -n "$(ls /tmp/xdrop-backups/kia-*.db 2>/dev/null)" && echo "backup OK"
