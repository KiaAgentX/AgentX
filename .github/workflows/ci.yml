name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck · test · build · secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck (src + tests, strict)
        run: npm run typecheck

      - name: Unit tests (node:test)
        run: npm test

      - name: Build
        run: npm run build

      - name: Secret scan (no real credentials in the repo)
        run: |
          PATTERNS='(sk-[A-Za-z0-9_-]{30,})|(gh[pousr]_[A-Za-z0-9]{30,})|([0-9]{8,10}:[A-Za-z0-9_-]{35})|(AKIA[0-9A-Z]{16})|(-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----)'
          HITS=$(grep -rEl "$PATTERNS" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=db . || true)
          if [ -n "$HITS" ]; then
            echo "::error::Potential secrets committed:"
            echo "$HITS"
            exit 1
          fi

      - name: Smoke — boot web-only mode
        run: |
          NODE_ENV=production PORT=3999 MCP_TOKEN_SECRET=ci-secret OWNER_IDS=1 \
          npx prisma db push --skip-generate
          NODE_ENV=production PORT=3999 MCP_TOKEN_SECRET=ci-secret OWNER_IDS=1 \
          node dist/index.js &
          sleep 6
          curl -fsS http://127.0.0.1:3999/healthz
          curl -fsS http://127.0.0.1:3999/api/v1/overview > /dev/null
          curl -fsS http://127.0.0.1:3999/api/v1/brand > /dev/null
