# ── KIA DropAgentX — one-command stack ───────────────────────────────────────
# Usage:
#   cp .env.example .env   # set BOT_TOKEN, DASHBOARD_KEY, OWNER_IDS …
#   docker compose up -d --build
#   open http://localhost:3000  (dashboard key = your DASHBOARD_KEY)
#
# The SQLite database lives in the named volume `xdrop-data` (mounted at /app/db),
# so your users, wallets and orders survive rebuilds and upgrades.
#
# Backup:  docker compose exec app npm run backup   → writes db/backups/*.db
# Restore: docker compose cp app:/app/db/backups/<file>.db ./restore.db

services:
  app:
    build: .
    container_name: xdrop
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Keep the DB on the volume regardless of what .env says
      DATABASE_URL: file:../db/custom.db
      NODE_ENV: production
    volumes:
      - xdrop-data:/app/db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5

volumes:
  xdrop-data:
