[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# extend-exclude (not exclude): keeps ruff's default exclusions — .venv, venv,
# __pycache__, .git … — active while adding project-specific paths.
extend-exclude = ["web/senpai/app.js", ".venv", "venv", ".pytest_cache"]

[tool.ruff.lint]
# Explicit, stable selection (ruff ≥0.17 widens its implicit defaults):
# pyflakes errors + pycodestyle errors. CI runs exactly this.
select = ["E4", "E7", "E9", "F"]
# Legacy-code exceptions (documented, deliberate):
#   E402 — module imports after sys.path/env bootstrap
#   E701/E702/E731 — historical one-liners & lambda assignments
#   E741 — ambiguous `l` names in old helpers
#   F841 — unused locals kept to avoid behavior drift
ignore = ["E402", "E701", "E702", "E731", "E741", "F841"]
