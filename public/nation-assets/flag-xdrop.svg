<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- XDrop National Flag — 3:2 — Aurora field, diagonal aurora ribbon, X+Drop monogram, Founder Star -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#251C55"/>
      <stop offset="1" stop-color="#130E32"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.45" stop-color="#7059DC"/>
      <stop offset="1" stop-color="#8B7CE8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7059DC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7059DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropcore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7059DC"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Field -->
  <rect width="1200" height="800" fill="url(#field)"/>
  <ellipse cx="600" cy="410" rx="560" ry="380" fill="url(#glow)"/>

  <!-- Aurora ribbon (diagonal, rising to fly) -->
  <g transform="rotate(-16 600 400)">
    <rect x="-260" y="308" width="1720" height="168" fill="url(#aurora)" opacity="0.82"/>
    <rect x="-260" y="360" width="1720" height="64" fill="#22D3EE" opacity="0.4" filter="url(#soft2)"/>
    <rect x="-260" y="385" width="1720" height="5" fill="#EAFBFF" opacity="0.75"/>
  </g>

  <!-- X beams (crisp white over soft halo) -->
  <g transform="translate(600 400)">
    <g filter="url(#soft)" opacity="0.75">
      <rect x="-252" y="-40" width="504" height="80" rx="40" transform="rotate(45)" fill="#A78BFA"/>
      <rect x="-252" y="-40" width="504" height="80" rx="40" transform="rotate(-45)" fill="#67E8F9"/>
    </g>
    <rect x="-252" y="-38" width="504" height="76" rx="38" transform="rotate(45)" fill="#FFFFFF"/>
    <rect x="-252" y="-38" width="504" height="76" rx="38" transform="rotate(-45)" fill="#FFFFFF"/>

    <!-- The Drop at the heart of the X (tip up) -->
    <g transform="scale(0.92)">
      <path d="M0,-84 C34,-32 66,4 66,48 A66,66 0 1 1 -66,48 C-66,4 -34,-32 0,-84 Z" fill="#FFFFFF"/>
      <path d="M0,-52 C22,-20 42,6 42,40 A42,42 0 1 1 -42,40 C-42,6 -22,-20 0,-52 Z" fill="url(#dropcore)"/>
      <circle cx="-16" cy="46" r="10" fill="#EAFBFF" opacity="0.85"/>
    </g>
  </g>

  <!-- Founder Star (upper hoist) -->
  <g transform="translate(172 152)">
    <path d="M0,-50 C7,-15 15,-7 50,0 C15,7 7,15 0,50 C-7,15 -15,7 -50,0 C-15,-7 -7,-15 0,-50 Z" fill="#F5C542"/>
    <circle r="9" fill="#FFF7DF"/>
  </g>
</svg>
